[tool.poetry]
name = "forecasting-lab"
version = "0.1.0"
description = "A personal research and engineering lab for time series analysis"
authors = ["rihem.mansour <rihem.mansour@infor.Com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^3.0.0"
numpy = "^2.4.2"
statsmodels = "^0.14.6"
keras = "^3.13.2"
tensorflow = "^2.20.0"


[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
